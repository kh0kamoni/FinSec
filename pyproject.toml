[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mfs-compliance-checker"
version = "1.0.0"
description = "Automated Compliance Checking Against Bangladesh Bank Cybersecurity Framework v1.0 (Feb 2025) Using Static Analysis and Machine Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "androguard>=4.1.4",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0"
]

[project.scripts]
mfs-check = "mfs_checker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
